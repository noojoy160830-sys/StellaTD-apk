name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find project folder
        run: |
          P=$(dirname "$(find . -name gradlew -not -path '*/node_modules/*' | head -n 1)")
          echo "Project folder: $P"
          echo "PROJ=$P" >> $GITHUB_ENV
      - name: Apply update (code pasted as text)
        run: |
          # The code comes as update_1.txt ... update_8.txt (small parts are easier to paste on a phone).
          EXPECT="1:21000 2:21000 3:21000 4:21000 5:21000 6:21000 7:21000 8:14560"
          SHA="b26fecef2a947b6bd531f9d1b48977c5842e26d444bacfbbe99cf3275da0b588"
          F=$(find . -name update_1.txt -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "No update_1.txt found - building the code as it is in the repo"
            exit 0
          fi
          D=$(dirname "$F")
          BAD=0
          : > /tmp/update.b64
          for e in $EXPECT; do
            i=${e%:*}; want=${e#*:}
            f="$D/update_$i.txt"
            if [ ! -f "$f" ]; then
              echo "::error::update_$i.txt is missing - create it and paste part $i"
              BAD=1; continue
            fi
            have=$(tr -d ' \r\n\t' < "$f" | wc -c)
            if [ "$have" != "$want" ]; then
              echo "::error::update_$i.txt has $have characters but should have $want - delete it and paste part $i again"
              BAD=1
            else
              echo "update_$i.txt OK ($have characters)"
            fi
            tr -d ' \r\n\t' < "$f" >> /tmp/update.b64
          done
          if [ "$BAD" = 1 ]; then exit 1; fi
          if [ "$(sha256sum /tmp/update.b64 | cut -c1-64)" != "$SHA" ]; then
            echo "::error::The parts are complete but their content doesn't match - one part was pasted into the wrong file or edited. Paste all parts again."
            exit 1
          fi
          base64 -d /tmp/update.b64 > /tmp/update.tar.xz
          tar -xJf /tmp/update.tar.xz -C "$PROJ"
          echo "Update applied"
      - name: Download game font (Kanit, OFL)
        working-directory: ${{ env.PROJ }}
        run: |
          mkdir -p app/src/main/assets/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl/kanit
          for f in Kanit-SemiBold.ttf Kanit-BlackItalic.ttf OFL.txt; do
            curl -fsSL "$base/$f" -o "app/src/main/assets/fonts/$f" || echo "Could not download $f (game will use the default font)"
          done
      - name: Signing key (keeps updates installable)
        working-directory: ${{ env.PROJ }}
        env:
          STELLA_KEYSTORE: ${{ secrets.STELLA_KEYSTORE }}
        run: |
          if [ -n "$STELLA_KEYSTORE" ]; then
            echo "$STELLA_KEYSTORE" | tr -d ' \r\n' | base64 -d > app/stella.keystore
            echo "Using the Stella signing key"
          else
            echo "::warning::No STELLA_KEYSTORE secret - using a temporary debug key (installing this build needs an uninstall first)"
          fi
      - name: Build APK
        working-directory: ${{ env.PROJ }}
        env:
          STELLA_KS_PASS: ${{ secrets.STELLA_KS_PASS }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleGameRelease assembleConsoleRelease
          cp app/build/outputs/apk/game/release/app-game-release.apk "$GITHUB_WORKSPACE/StellaTD.apk"
          cp app/build/outputs/apk/console/release/app-console-release.apk "$GITHUB_WORKSPACE/StellaConsole.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: StellaTD-apk
          path: |
            StellaTD.apk
            StellaConsole.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.${{ github.run_number }}
          name: Stella TD v3.3.${{ github.run_number }}
          make_latest: true
          files: |
            StellaTD.apk
            StellaConsole.apk
