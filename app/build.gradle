plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stella.td'
    compileSdk 34

    defaultConfig {
        applicationId 'com.stella.td'
        minSdk 24
        targetSdk 34
        versionCode 20
        versionName '3.8'
    }

    // Two apps from one codebase:
    //   game    -> "Stella TD"       (com.stella.td)
    //   console -> "Stella Console"  (com.stella.td.console) staff-only admin console
    flavorDimensions 'app'
    productFlavors {
        game {
            dimension 'app'
        }
        console {
            dimension 'app'
            applicationIdSuffix '.console'
            versionNameSuffix '-console'
        }
    }

    // A fixed key keeps every build installable over the previous one (no uninstall, data kept).
    // The workflow writes app/stella.keystore from the STELLA_KEYSTORE secret; without it the debug key is used.
    def stellaKs = file('stella.keystore')
    signingConfigs {
        stella {
            storeFile stellaKs
            storePassword System.getenv('STELLA_KS_PASS') ?: ''
            keyAlias 'stella'
            keyPassword System.getenv('STELLA_KS_PASS') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig stellaKs.exists() ? signingConfigs.stella : signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
