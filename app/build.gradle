plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stella.td'
    compileSdk 34

    defaultConfig {
        applicationId 'com.stella.td'
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName '3.2'
    }

    // Two apps from one codebase:
    //   game    -> "Stella TD"       (com.stella.td)
    //   console -> "Stella Console"  (com.stella.td.console) staff-only admin console
    flavorDimensions 'app'
    productFlavors {
        game {
            dimension 'app'
        }
        console {
            dimension 'app'
            applicationIdSuffix '.console'
            versionNameSuffix '-console'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without extra setup.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
